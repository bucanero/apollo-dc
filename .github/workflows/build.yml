name: DC Build

on: [push, pull_request]

env:
  BUILD_TYPE: Release
  # Every dependency is pinned to the versions of the known-good local build (bba-net 27c9efc,
  # tested on real hardware). Following branch heads broke the build once: GPF/SDL 59c7967
  # dropped the OpenGL renderer by default and the app couldn't create its renderer.
  # Bump these on purpose, and test the result on real hardware.
  KOS_COMMIT: d81aa3fda0520b6ca64098ce9d1d43e7562142d9          # KallistiOS master, 2026-10-27
  KOS_PORTS_COMMIT: f4faacc42faaf552625777b7709e871a827e1055    # kos-ports master, 2026-07-14
  GLDC_COMMIT: d32a07cff0ce2954c8981b3e5092039e6e3b9776         # GLdc (libGL port) 1.1-726-gd32a
  SDL_COMMIT: 10f41e6820708efc74fb194db7d49bcc07a0b7e7          # GPF/SDL dreamcastSDL2, 2026-09-13
  APOLLO_LIB_COMMIT: 046f12a58af8dc3f8b51732eb688eeb5432891a5   # apollo-lib "v3 update for dc / ps2 (#80)"
  MINI18N_COMMIT: 0717bb70ad453f0678b80325077ebc764481b927      # mini18n (localization)
  MKDCDISC_COMMIT: 2b98b0d9480e364e3517355648fbc3b49fb19882     # mkdcdisc
  ARCHIVE_URL: https://github.com/bucanero/ps3toolchain/releases/download/macos-latest-a5186b17
  ARCHIVE_KOS_PORTS_SHA256: a14d10f91241b7eedf6da6a01406916862e55cb5d1e0db1897cf02f8905b5c76
  ARCHIVE_ADDONS_SHA256: 41f6eb415664b42c0723374477bc414070222074eaeec03b6a64d16ad9549559

jobs:
  dc:
    name: Dreamcast Build (KOS)
    runs-on: ubuntu-latest
    # 15.2.1-dev, pinned by digest (the tag can be re-pushed)
    container: pcercuei/dreamcast-toolchain@sha256:015d2e42c6842fb404f3357916a037158831124d2153f6f0356515f55cd1b565

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk update
          apk add gmp mpc1 mpfr4 make cmake git bash curl meson ninja build-base pkgconf libisofs-dev libpng-dev
          # clone_at <url> <commit> <dir>: check out exactly that commit
          clone_at() {
            git init -q "$3"
            git -C "$3" remote add origin "$1"
            git -C "$3" fetch -q --depth 1 origin "$2"
            git -C "$3" checkout -q FETCH_HEAD
            echo "$3: $(git -C "$3" rev-parse HEAD)"
          }
          git clone https://github.com/bucanero/dbglogger
          clone_at https://github.com/bucanero/apollo-lib $APOLLO_LIB_COMMIT apollo-lib
          clone_at https://github.com/bucanero/mini18n $MINI18N_COMMIT mini18n
          clone_at https://github.com/GPF/SDL $SDL_COMMIT SDL
          rm -rf /opt/toolchains/dc/kos /opt/toolchains/dc/kos-ports
          clone_at https://github.com/KallistiOS/KallistiOS.git $KOS_COMMIT /opt/toolchains/dc/kos
          clone_at https://github.com/KallistiOS/kos-ports $KOS_PORTS_COMMIT /opt/toolchains/dc/kos-ports
          git -C /opt/toolchains/dc/kos-ports submodule update --init --recursive --depth 1
          clone_at https://gitlab.com/simulant/mkdcdisc.git $MKDCDISC_COMMIT /opt/mkdcdisc
          # disc contents: only the Dreamcast parts of the save and patch databases
          git clone --depth 1 --filter=blob:none --sparse https://github.com/bucanero/apollo-saves ../apollo-saves
          git -C ../apollo-saves sparse-checkout set DC
          git clone --depth 1 --filter=blob:none --sparse https://github.com/bucanero/apollo-patches ../apollo-patches
          git -C ../apollo-patches sparse-checkout set DC python

      - name: build KOS
        run: |
          cd /opt/toolchains/dc/kos
          cp doc/environ.sh.sample environ.sh
          . /opt/toolchains/dc/kos/environ.sh
          make

      - name: build KOS-ports
        run: |
          . /opt/toolchains/dc/kos/environ.sh
          cd /opt/toolchains/dc/kos-ports
          # prebuilt ports: zlib, libpng, libzip, freetype, curl, polarssl, apollo-lib, dbglogger, ...
          curl -sL -o /tmp/archive_kos-ports.tar.gz $ARCHIVE_URL/archive_kos-ports.tar.gz
          echo "$ARCHIVE_KOS_PORTS_SHA256  /tmp/archive_kos-ports.tar.gz" | sha256sum -c -
          tar xzf /tmp/archive_kos-ports.tar.gz -C ./
          # the archived GLdc is outdated: build a newer one (ARGB4444 textures, for the translucent panels)
          cd libGL
          sed -i "s/^CMAKE_ARGS = .*/CMAKE_ARGS =        -DCMAKE_BUILD_TYPE=Release -DBUILD_SAMPLES=OFF -DBUILD_TESTS=OFF/" Makefile
          # the port follows GLdc master: pin it (kos-ports resets the clone to GIT_CHANGESET)
          echo "GIT_CHANGESET =     $GLDC_COMMIT" >> Makefile
          make install clean
          cd ..
          # mbedTLS with an entropy hook: the Dreamcast has no RNG, so the app provides
          # mbedtls_hardware_poll() (source/http.c); without one, TLS can't start.
          # The archive left real header folders behind: remove them so the ports can link theirs
          rm -rf include/mbedtls include/psa include/curl
          sed -i "s|^//#define MBEDTLS_ENTROPY_HARDWARE_ALT|#define MBEDTLS_ENTROPY_HARDWARE_ALT|" mbedtls/files/mbedtls_config.h
          make -C mbedtls force-install clean
          # curl (https through mbedTLS), rebuilt against that mbedTLS
          make -C curl force-install clean
#          cd zlib
#          make install
#          cd ../polarssl
#          make install
#          cd ../libpng
#          make install
#          cd ../libzip
#          make install
#          cd ../libGL
#          make install
#          cd ../freetype
#          make install
#          cd ../mbedtls
#          make install
#          cd ../curl
#          make install

      - name: build SDL2
        run: |
          . /opt/toolchains/dc/kos/environ.sh
          cd /opt/toolchains/dc/kos/addons
          curl -sL -o /tmp/archive_addons.tar.gz $ARCHIVE_URL/archive_addons.tar.gz
          echo "$ARCHIVE_ADDONS_SHA256  /tmp/archive_addons.tar.gz" | sha256sum -c -
          tar xzf /tmp/archive_addons.tar.gz -C ./
          # the archived libkosfat was built against another KOS revision: rebuild it against this one
          make -C libkosfat clean
          make -C libkosfat
          # replace the archived SDL2 with the pinned dreamcastSDL2 commit, built against the new GLdc.
          # The app uses SDL's OpenGL (GLdc) renderer: ask for it explicitly, newer SDL drops it by default
          cd $GITHUB_WORKSPACE/SDL/build-scripts
          bash ./dreamcast.sh --enable-opengl install

      - name: build dbglogger
        run: |
          . /opt/toolchains/dc/kos/environ.sh
          cd dbglogger
#          make -f Makefile.DC install

      - name: build apollo lib
        run: |
          . /opt/toolchains/dc/kos/environ.sh
          cd apollo-lib
          # replace the archived apollo-lib (v1.4.0) with this one (MicroPython, 512 KB heap)
          make -f Makefile.DC install

      - name: build mini18n
        run: |
          . /opt/toolchains/dc/kos/environ.sh
          cd mini18n
          # only the static library: the Dreamcast has no shared libraries
          kos-cmake -S . -B build -D CMAKE_BUILD_TYPE=Release
          make -C build mini18n-static
          cp build/src/libmini18n.a $KOS_PORTS/lib/
          cp src/mini18n.h $KOS_PORTS/include/

      - name: build mkdcdisc
        run: |
          cd /opt/mkdcdisc
          meson setup builddir
          meson compile -C builddir

      - name: Build project
        run: |
          . /opt/toolchains/dc/kos/environ.sh
          kos-cmake -S . -D CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -D MKDCDISC=/opt/mkdcdisc/builddir/mkdcdisc
          make
          make cdi

      - name: Artifact name
        run: |
          echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: apollo-dc-build_${{ env.sha_name }}
          path: |
            APOLLO-DC.elf
            APOLLO-DC.BIN
            apollo-dc.cdi
          if-no-files-found: error
